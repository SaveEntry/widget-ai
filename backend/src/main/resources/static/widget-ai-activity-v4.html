<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget.ai poll</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: transparent; color: CanvasText; }
    main { width: 100%; margin: 0; padding: 16px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 16px; background: Canvas; }
    .brand { display: flex; align-items: center; gap: 8px; color: #6655d9; font-weight: 700; }
    .mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: #eeeaff; color: #6655d9; }
    .tag { margin-left: auto; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, #6655d9 12%, Canvas); color: #6655d9; font-size: 10px; }
    .eyebrow { margin: 13px 0 3px; color: GrayText; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 19px; line-height: 1.3; }
    #choices { display: grid; gap: 6px; }
    .choice { position: relative; display: flex; width: 100%; min-height: 40px; align-items: center; justify-content: space-between; overflow: hidden; padding: 8px 11px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 10px; background: Canvas; color: CanvasText; text-align: left; cursor: pointer; }
    .choice:hover:not(:disabled), .choice[aria-pressed="true"] { border-color: #7667dc; background: color-mix(in srgb, #6655d9 7%, Canvas); }
    .choice:disabled { cursor: default; }
    .bar { position: absolute; inset: 0 auto 0 0; z-index: 0; background: color-mix(in srgb, #6655d9 12%, Canvas); }
    .label, .result { position: relative; z-index: 1; }
    .label { min-width: 0; overflow-wrap: anywhere; }
    .result { flex: 0 0 auto; margin-left: 10px; color: GrayText; font-size: 11px; white-space: nowrap; }
    .note { margin: 10px 0 0; padding: 7px 9px; border-inline-start: 3px solid color-mix(in srgb, #6655d9 55%, Canvas); border-radius: 7px; background: color-mix(in srgb, #6655d9 6%, Canvas); color: GrayText; font-size: 11px; line-height: 1.4; }
    .actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    button.action { flex: 1; min-height: 38px; padding: 8px 12px; border: 0; border-radius: 9px; background: #6655d9; color: white; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
    button.action.secondary { flex: 0 0 auto; min-width: 68px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); background: Canvas; color: CanvasText; }
    button.action:disabled { opacity: .55; cursor: not-allowed; }
    #status { min-height: 0; margin-top: 8px; color: GrayText; font-size: 11px; }
    #status:empty { display: none; }
    #status.error { color: #b42318; }
    @media (max-width: 420px) { main { padding: 12px; border-radius: 12px; } }
  </style>
</head>
<body>
  <main aria-labelledby="question">
    <div class="brand"><span class="mark" aria-hidden="true">W</span> Widget.ai <span class="tag">OPTIONAL POLL</span></div>
    <p class="eyebrow">Community question</p>
    <h1 id="question">Loading a poll…</h1>
    <div id="choices" aria-label="Poll choices"></div>
    <p id="disclosure" class="note"></p>
    <div id="actions" class="actions"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const questionEl = document.querySelector('#question');
      const choicesEl = document.querySelector('#choices');
      const disclosureEl = document.querySelector('#disclosure');
      const actionsEl = document.querySelector('#actions');
      const statusEl = document.querySelector('#status');
      const cardEl = document.querySelector('main');
      let poll = null;
      let selection = null;
      let busy = false;
      let requestId = 0;
      const pending = new Map();
      const locallyVotedPolls = new Set();
      const voterId = getVoterId();

      let heightFrame = 0;
      function reportIntrinsicHeight() {
        if (!window.openai?.notifyIntrinsicHeight) return;
        cancelAnimationFrame(heightFrame);
        heightFrame = requestAnimationFrame(() => {
          window.openai.notifyIntrinsicHeight(Math.ceil(cardEl.getBoundingClientRect().height));
        });
      }
      if ('ResizeObserver' in window) {
        new ResizeObserver(reportIntrinsicHeight).observe(cardEl);
      }
      reportIntrinsicHeight();

      function markVoted(pollId) {
        locallyVotedPolls.add(pollId);
        try { localStorage.setItem(`widget-ai-voted:${pollId}`, 'true'); } catch (_) {}
      }

      function alreadyVoted(pollId) {
        if (locallyVotedPolls.has(pollId)) return true;
        try { return localStorage.getItem(`widget-ai-voted:${pollId}`) === 'true'; } catch (_) { return false; }
      }

      function getVoterId() {
        const key = 'widget-ai-voter-id';
        try {
          let id = localStorage.getItem(key);
          if (!id) { id = crypto.randomUUID(); localStorage.setItem(key, id); }
          return id;
        } catch (_) { return crypto.randomUUID(); }
      }

      function rpcRequest(method, params) {
        const id = ++requestId;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(new Error('The ChatGPT connection timed out.')); }, 30000);
          pending.set(id, { resolve, reject, timer });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }

      function rpcNotify(method, params) {
        window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
      }

      function payloadFrom(result) {
        if (result && result.structuredContent) return result.structuredContent;
        if (result && Array.isArray(result.content)) {
          const text = result.content.find(item => item && item.type === 'text' && typeof item.text === 'string')?.text;
          if (text) {
            try { return JSON.parse(text); } catch (_) { return { message: text }; }
          }
        }
        return result || {};
      }

      function showError(error) {
        statusEl.textContent = error && error.message ? error.message : 'Something went wrong. Please try again.';
        statusEl.className = 'error';
      }

      function setStatus(message) {
        statusEl.textContent = message || '';
        statusEl.className = '';
      }

      function render(data) {
        if (!data) return;
        if (data.isError) {
          const message = data.content?.find(item => item.type === 'text')?.text || 'The poll could not be loaded.';
          showError(new Error(message));
          return;
        }
        const payload = payloadFrom(data);
        if (payload.poll !== undefined) {
          if (!payload.hasPoll || !payload.poll) {
            poll = null;
            questionEl.textContent = 'No active polls right now';
            choicesEl.replaceChildren();
            disclosureEl.textContent = payload.message || 'Please check back later.';
            actionsEl.replaceChildren();
            setStatus('');
            return;
          }
          poll = payload.poll;
        } else if (payload.id && Array.isArray(payload.options)) {
          poll = payload;
        }
        if (!poll) return;

        selection = poll.selectedOptionId || selection;
        questionEl.textContent = poll.question;
        disclosureEl.textContent = 'Optional poll. No rewards are issued in this demo.';
        const hasVoted = Boolean(poll.selectedOptionId) || alreadyVoted(poll.id);
        choicesEl.replaceChildren(...poll.options.map(option => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'choice';
          button.setAttribute('aria-pressed', String(selection === option.id));
          button.disabled = hasVoted || !poll.active || busy;
          button.addEventListener('click', () => { selection = option.id; render(poll); });
          if (hasVoted) {
            const bar = document.createElement('span');
            bar.className = 'bar';
            bar.style.width = `${option.percent}%`;
            button.append(bar);
          }
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = option.label;
          button.append(label);
          if (hasVoted) {
            const result = document.createElement('span');
            result.className = 'result';
            result.textContent = `${option.percent}% · ${option.votes}`;
            button.append(result);
          }
          return button;
        }));

        actionsEl.replaceChildren();
        if (!hasVoted && poll.active) {
          const submit = document.createElement('button');
          submit.type = 'button';
          submit.className = 'action';
          submit.textContent = busy ? 'Submitting…' : 'Submit vote';
          submit.disabled = !selection || busy;
          submit.addEventListener('click', submitVote);
          actionsEl.append(submit);
          const skip = document.createElement('button');
          skip.type = 'button';
          skip.className = 'action secondary';
          skip.textContent = 'Skip';
          skip.disabled = busy;
          skip.addEventListener('click', () => { poll = null; questionEl.textContent = 'Poll skipped'; choicesEl.replaceChildren(); disclosureEl.textContent = 'Your response was not recorded.'; actionsEl.replaceChildren(); setStatus(''); });
          actionsEl.append(skip);
        } else {
          const done = document.createElement('p');
          done.className = 'note';
          done.textContent = poll.active ? `Thanks for voting · ${poll.totalVotes} ${poll.totalVotes === 1 ? 'vote' : 'votes'}` : 'This poll is closed.';
          actionsEl.append(done);
        }
      }

      async function submitVote() {
        if (!poll || !selection || busy) return;
        busy = true;
        setStatus('Submitting your vote…');
        render(poll);
        try {
          const response = await rpcRequest('tools/call', {
            name: 'submit_widgetai_vote',
            arguments: { pollId: poll.id, optionId: selection, voterId },
          });
          busy = false;
          const result = payloadFrom(response);
          if (response?.isError) {
            const message = response.content?.find(item => item.type === 'text')?.text || 'Your vote could not be submitted.';
            if (/already voted/i.test(message)) {
              markVoted(poll.id);
              render(poll);
              setStatus('You already voted. Here are the current results.');
              return;
            }
            showError(new Error(message));
          } else {
            markVoted(poll.id);
            render(result);
            setStatus('');
          }
        } catch (error) {
          busy = false;
          if (/already voted/i.test(error?.message || '')) {
            markVoted(poll.id);
            render(poll);
            setStatus('You already voted. Here are the current results.');
            return;
          }
          render(poll);
          showError(error);
        }
      }

      window.addEventListener('message', event => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0') return;
        if (typeof message.id === 'number') {
          const item = pending.get(message.id);
          if (!item) return;
          clearTimeout(item.timer);
          pending.delete(message.id);
          if (message.error) item.reject(new Error(message.error.message || 'The ChatGPT connection failed.'));
          else item.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/tool-result') render(message.params);
        if (message.method === 'ui/notifications/tool-input-partial') setStatus('Loading poll…');
      }, { passive: true });

      async function start() {
        try {
          await rpcRequest('ui/initialize', {
            appInfo: { name: 'Widget.ai', version: '0.2.0' },
            appCapabilities: {},
            protocolVersion: '2026-01-26',
          });
          rpcNotify('ui/notifications/initialized', {});
          const initial = window.openai && window.openai.toolOutput;
          if (initial) render(initial);
          try {
            const refreshed = await rpcRequest('tools/call', {
              name: 'show_widgetai',
              arguments: { voterId },
            });
            if (!refreshed?.isError) render(refreshed);
          } catch (_) {
            // Keep the poll payload supplied during tool invocation as a fallback.
          }
        } catch (error) { showError(error); }
      }

      start();
    })();
  </script>
</body>
</html>
