<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget.ai poll</title>
  <style>
    :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: transparent; color: CanvasText; }
    main { max-width: 520px; margin: auto; padding: 22px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 18px; background: Canvas; }
    .brand { display: flex; align-items: center; gap: 9px; color: #6655d9; font-weight: 700; }
    .mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: #eeeaff; color: #6655d9; }
    .tag { margin-left: auto; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, #6655d9 12%, Canvas); color: #6655d9; font-size: 11px; }
    .eyebrow { margin: 20px 0 5px; color: GrayText; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: 21px; line-height: 1.25; }
    #choices { display: grid; gap: 8px; }
    .choice { position: relative; display: flex; width: 100%; min-height: 44px; align-items: center; justify-content: space-between; overflow: hidden; padding: 10px 13px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 11px; background: Canvas; color: CanvasText; text-align: left; cursor: pointer; }
    .choice:hover:not(:disabled), .choice[aria-pressed="true"] { border-color: #7667dc; background: color-mix(in srgb, #6655d9 7%, Canvas); }
    .choice:disabled { cursor: default; }
    .bar { position: absolute; inset: 0 auto 0 0; z-index: 0; background: color-mix(in srgb, #6655d9 12%, Canvas); }
    .label, .result { position: relative; z-index: 1; }
    .result { color: GrayText; font-size: 12px; }
    .note { margin: 15px 0 0; color: GrayText; font-size: 12px; }
    .actions { display: flex; gap: 9px; margin-top: 14px; }
    button.action { flex: 1; padding: 11px 14px; border: 0; border-radius: 10px; background: #6655d9; color: white; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; }
    button.action.secondary { border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); background: Canvas; color: CanvasText; }
    button.action:disabled { opacity: .55; cursor: not-allowed; }
    #status { min-height: 20px; margin-top: 10px; color: GrayText; font-size: 12px; }
    #status.error { color: #b42318; }
  </style>
</head>
<body>
  <main aria-labelledby="question">
    <div class="brand"><span class="mark" aria-hidden="true">W</span> Widget.ai <span class="tag">OPTIONAL POLL</span></div>
    <p class="eyebrow">Community question</p>
    <h1 id="question">Loading a poll…</h1>
    <div id="choices" aria-label="Poll choices"></div>
    <p id="disclosure" class="note"></p>
    <div id="actions" class="actions"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const questionEl = document.querySelector('#question');
      const choicesEl = document.querySelector('#choices');
      const disclosureEl = document.querySelector('#disclosure');
      const actionsEl = document.querySelector('#actions');
      const statusEl = document.querySelector('#status');
      let poll = null;
      let selection = null;
      let busy = false;
      let requestId = 0;
      const pending = new Map();
      const voterId = getVoterId();

      function getVoterId() {
        const key = 'widget-ai-voter-id';
        try {
          let id = localStorage.getItem(key);
          if (!id) { id = crypto.randomUUID(); localStorage.setItem(key, id); }
          return id;
        } catch (_) { return crypto.randomUUID(); }
      }

      function rpcRequest(method, params) {
        const id = ++requestId;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(new Error('The ChatGPT connection timed out.')); }, 30000);
          pending.set(id, { resolve, reject, timer });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }

      function rpcNotify(method, params) {
        window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
      }

      function payloadFrom(result) {
        if (result && result.structuredContent) return result.structuredContent;
        if (result && Array.isArray(result.content)) {
          const text = result.content.find(item => item && item.type === 'text' && typeof item.text === 'string')?.text;
          if (text) {
            try { return JSON.parse(text); } catch (_) { return { message: text }; }
          }
        }
        return result || {};
      }

      function showError(error) {
        statusEl.textContent = error && error.message ? error.message : 'Something went wrong. Please try again.';
        statusEl.className = 'error';
      }

      function setStatus(message) {
        statusEl.textContent = message || '';
        statusEl.className = '';
      }

      function render(data) {
        if (!data) return;
        if (data.isError) {
          const message = data.content?.find(item => item.type === 'text')?.text || 'The poll could not be loaded.';
          showError(new Error(message));
          return;
        }
        const payload = payloadFrom(data);
        if (payload.poll !== undefined) {
          if (!payload.hasPoll || !payload.poll) {
            poll = null;
            questionEl.textContent = 'No active polls right now';
            choicesEl.replaceChildren();
            disclosureEl.textContent = payload.message || 'Please check back later.';
            actionsEl.replaceChildren();
            setStatus('');
            return;
          }
          poll = payload.poll;
        } else if (payload.id && Array.isArray(payload.options)) {
          poll = payload;
        }
        if (!poll) return;

        selection = poll.selectedOptionId || selection;
        questionEl.textContent = poll.question;
        disclosureEl.textContent = `${poll.rewardDisclosure || 'No rewards are offered for this poll.'} This demo does not issue points or rewards.`;
        const hasVoted = Boolean(poll.selectedOptionId);
        choicesEl.replaceChildren(...poll.options.map(option => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'choice';
          button.setAttribute('aria-pressed', String(selection === option.id));
          button.disabled = hasVoted || !poll.active || busy;
          button.addEventListener('click', () => { selection = option.id; render(poll); });
          if (hasVoted) {
            const bar = document.createElement('span');
            bar.className = 'bar';
            bar.style.width = `${option.percent}%`;
            button.append(bar);
          }
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = option.label;
          button.append(label);
          if (hasVoted) {
            const result = document.createElement('span');
            result.className = 'result';
            result.textContent = `${option.percent}% · ${option.votes}`;
            button.append(result);
          }
          return button;
        }));

        actionsEl.replaceChildren();
        if (!hasVoted && poll.active) {
          const submit = document.createElement('button');
          submit.type = 'button';
          submit.className = 'action';
          submit.textContent = busy ? 'Submitting…' : 'Submit vote';
          submit.disabled = !selection || busy;
          submit.addEventListener('click', submitVote);
          actionsEl.append(submit);
          const skip = document.createElement('button');
          skip.type = 'button';
          skip.className = 'action secondary';
          skip.textContent = 'Skip';
          skip.disabled = busy;
          skip.addEventListener('click', () => { poll = null; questionEl.textContent = 'Poll skipped'; choicesEl.replaceChildren(); disclosureEl.textContent = 'You can close this activity at any time.'; actionsEl.replaceChildren(); setStatus(''); });
          actionsEl.append(skip);
        } else {
          const done = document.createElement('p');
          done.className = 'note';
          done.textContent = poll.active ? `Thanks for voting · ${poll.totalVotes} ${poll.totalVotes === 1 ? 'vote' : 'votes'}` : 'This poll is closed.';
          actionsEl.append(done);
        }
      }

      async function submitVote() {
        if (!poll || !selection || busy) return;
        busy = true;
        setStatus('Submitting your vote…');
        render(poll);
        try {
          const response = await rpcRequest('tools/call', {
            name: 'submit_widgetai_vote',
            arguments: { pollId: poll.id, optionId: selection, voterId },
          });
          busy = false;
          const result = payloadFrom(response);
          if (response?.isError) {
            const message = response.content?.find(item => item.type === 'text')?.text || 'Your vote could not be submitted.';
            showError(new Error(message));
          } else {
            render(result);
            setStatus('');
          }
        } catch (error) { busy = false; render(poll); showError(error); }
      }

      window.addEventListener('message', event => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0') return;
        if (typeof message.id === 'number') {
          const item = pending.get(message.id);
          if (!item) return;
          clearTimeout(item.timer);
          pending.delete(message.id);
          if (message.error) item.reject(new Error(message.error.message || 'The ChatGPT connection failed.'));
          else item.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/tool-result') render(message.params);
        if (message.method === 'ui/notifications/tool-input-partial') setStatus('Loading poll…');
      }, { passive: true });

      async function start() {
        try {
          await rpcRequest('ui/initialize', {
            appInfo: { name: 'Widget.ai', version: '0.2.0' },
            appCapabilities: {},
            protocolVersion: '2026-01-26',
          });
          rpcNotify('ui/notifications/initialized', {});
          const initial = window.openai && window.openai.toolOutput;
          if (initial) render(initial);
        } catch (error) { showError(error); }
      }

      start();
    })();
  </script>
</body>
</html>
