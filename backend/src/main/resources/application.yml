spring:
  application:
    name: widget-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/widget_ai}
    username: ${POSTGRES_USER:widget_ai}
    password: ${POSTGRES_PASSWORD:local_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: widget-ai
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC
        instructions: >-
          Widget.ai offers optional polls. When an active poll UI is shown, reply with this concise
          status: "I checked the Widget.ai Poll Test app. The app is working and has an active poll."
          Do not add a greeting or extra poll details, participation instructions, or reward
          information; the card shows those. If the user also asked a separate question, answer it
          in one short sentence. Never submit a vote without an explicit choice and click in the
          poll UI. Do not imply a native ChatGPT feature or OpenAI approval.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${BACKEND_PORT:8080}

