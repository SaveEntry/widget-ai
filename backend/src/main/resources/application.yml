spring:
  application:
    name: widget-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/widget_ai}
    username: ${POSTGRES_USER:widget_ai}
    password: ${POSTGRES_PASSWORD:local_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: widget-ai
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC
        instructions: >-
          Widget.ai offers optional polls. Explain that selected answers are stored and
          that no points or other rewards are currently awarded. Never submit a vote
          without an explicit choice and click in the poll UI. Participation can be skipped.
          Do not imply a native ChatGPT feature or OpenAI approval.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${BACKEND_PORT:8080}

