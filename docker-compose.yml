services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-widget_ai}
      POSTGRES_USER: ${POSTGRES_USER:-widget_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - widget-ai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-widget_ai} -d ${POSTGRES_DB:-widget_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  widget-ai-postgres:

